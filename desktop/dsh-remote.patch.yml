# Remote clients cannot operate an OS-native dialog shown on the host PC.
# Pin Harness to its official in-app directory browser so desktop, phone, and
# tablet clients all choose the same host-side workspace path inside the UI.
- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-auto'
  disabled: true

- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
