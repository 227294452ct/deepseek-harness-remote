<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Microsoft YaHei UI",system-ui,sans-serif;background:transparent;color:#fff}main{height:100%;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border:1px solid rgba(147,197,253,.38);border-radius:13px;background:rgba(10,22,39,.96);box-shadow:0 10px 30px rgba(0,0,0,.35)}.dot{width:9px;height:9px;flex:none;border-radius:50%;background:#4ade80;box-shadow:0 0 0 5px rgba(74,222,128,.13)}.text{min-width:0;flex:1}.title{font-size:12px;font-weight:700}.device{margin-top:2px;color:#a8bad0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button{height:32px;flex:none;border:1px solid rgba(248,113,113,.35);border-radius:9px;background:rgba(127,29,29,.5);color:#fecaca;padding:0 11px;font:700 11px inherit;cursor:pointer}
</style></head><body><main><span class="dot"></span><div class="text"><div class="title">手机正在控制桌面</div><div id="device" class="device"></div></div><button id="stop">立即停止</button></main><script>window.dshDesktopControl.onState(state=>{document.getElementById('device').textContent=state.deviceName||'已配对设备'});document.getElementById('stop').onclick=()=>window.dshDesktopControl.stop()</script></body></html>
